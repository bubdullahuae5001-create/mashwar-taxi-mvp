<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0f766e" />
  <title>مشوار | اطلب سيارة بسهولة</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="brand-row">
      <div class="brand-mark">م</div>
      <div>
        <strong id="appName">مشوار</strong>
        <small>طلب سيارة أجرة ببساطة</small>
      </div>
      <a class="admin-link" href="admin.html">الإدارة</a>
    </header>

    <section class="hero">
      <span class="eyebrow">طلب سريع بدون تعقيد</span>
      <h1>اطلب سيارة بسهولة</h1>
      <p>حدد الانطلاق والوجهة، أدخل رقم هاتفك، وأرسل الطلب.</p>
    </section>

    <section class="card" id="requestCard">
      <form id="rideForm" novalidate>
        <div class="field full">
          <label for="customerName">الاسم</label>
          <input id="customerName" name="customerName" autocomplete="name" placeholder="اسم العميل" required />
        </div>
        <div class="field full">
          <label for="pickup">موقع الانطلاق</label>
          <input id="pickup" name="pickup" placeholder="مثال: الفلاح - أبوظبي" required />
        </div>
        <div class="field full">
          <label for="destination">الوجهة</label>
          <input id="destination" name="destination" placeholder="مثال: مطار زايد الدولي" required />
        </div>

        <fieldset class="field full">
          <legend>وقت الطلب</legend>
          <div class="segmented">
            <label><input type="radio" name="timeType" value="now" checked /> <span>الآن</span></label>
            <label><input type="radio" name="timeType" value="later" /> <span>لاحقًا</span></label>
          </div>
        </fieldset>

        <div class="field full hidden" id="laterWrap">
          <label for="scheduledAt">حدد الوقت</label>
          <input id="scheduledAt" name="scheduledAt" type="datetime-local" />
        </div>

        <div class="grid-2">
          <div class="field">
            <label for="phone">رقم الهاتف</label>
            <input id="phone" name="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="05xxxxxxxx" required />
          </div>
          <div class="field">
            <label for="passengers">عدد الركاب</label>
            <select id="passengers" name="passengers">
              <option value="1">1</option><option value="2">2</option><option value="3">3</option>
              <option value="4">4</option><option value="5">5</option><option value="6">6</option>
            </select>
          </div>
        </div>

        <div class="field full">
          <label for="notes">ملاحظات اختيارية</label>
          <textarea id="notes" name="notes" rows="3" placeholder="مثال: معي حقيبتان"></textarea>
        </div>

        <div id="formError" class="alert error hidden" role="alert"></div>
        <button class="primary big" type="submit">إرسال طلب سيارة</button>
      </form>
    </section>

    <section class="trust-note">لا يوجد دفع إلكتروني في هذه النسخة. سيتم التواصل معك لتأكيد السيارة.</section>
  </main>

  <dialog id="confirmDialog">
    <div class="dialog-card">
      <h2>تأكيد الطلب</h2>
      <div id="summary" class="summary"></div>
      <div class="dialog-actions">
        <button id="cancelConfirm" class="secondary" type="button">تعديل</button>
        <button id="confirmRequest" class="primary" type="button">تأكيد الطلب</button>
      </div>
    </div>
  </dialog>

  <dialog id="successDialog">
    <div class="dialog-card center">
      <div class="success-icon">✓</div>
      <h2>تم استلام طلبك</h2>
      <p>سيتم التواصل معك لتأكيد السيارة.</p>
      <div class="order-box">رقم الطلب <strong id="orderNumber"></strong></div>
      <button id="newRequest" class="primary big" type="button">طلب جديد</button>
    </div>
  </dialog>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
