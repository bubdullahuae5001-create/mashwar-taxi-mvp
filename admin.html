<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة الإدارة</title><link rel="stylesheet" href="styles.css"></head>
<body>
<section id="loginView" class="login-card">
  <div class="brand-row"><div class="brand-mark">م</div><div><strong>لوحة الإدارة</strong><small>دخول المدير</small></div></div>
  <form id="loginForm"><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required></div><div id="loginError" class="alert error hidden"></div><button class="primary big">دخول</button></form>
  <p class="muted">استخدم حساب المدير الذي تنشئه داخل Supabase Authentication.</p>
</section>

<main id="adminView" class="admin-shell hidden">
  <div class="topbar"><div><h1 style="margin:0">لوحة الطلبات</h1><div class="muted">إدارة الطلبات والسائقين</div></div><span id="countStat" class="stat"></span><div class="spacer"></div><a class="secondary mini" href="index.html">الموقع</a><button id="refreshBtn" class="secondary mini">تحديث</button><button id="logoutBtn" class="danger mini">خروج</button></div>
  <section class="card" style="margin-bottom:16px"><div class="section-title"><h2 style="margin:0;font-size:18px">الطلبات</h2></div><div class="toolbar"><input id="searchInput" placeholder="بحث برقم الطلب أو الهاتف"><select id="statusFilter"><option value="">كل الحالات</option><option value="new">جديد</option><option value="contacted">تم التواصل</option><option value="confirmed">تم تأكيد السيارة</option><option value="on_the_way">السائق في الطريق</option><option value="completed">مكتمل</option><option value="cancelled">ملغي</option></select></div><div class="table-wrap"><table class="data-table"><thead><tr><th>رقم الطلب</th><th>العميل</th><th>الهاتف</th><th>الانطلاق</th><th>الوجهة</th><th>الوقت</th><th>الركاب</th><th>الملاحظات</th><th>الحالة</th><th>السائق</th><th>إجراءات</th></tr></thead><tbody id="ordersBody"></tbody></table></div></section>
  <section class="card"><div class="section-title"><h2 style="margin:0;font-size:18px">السائقون</h2></div><form id="driverForm" class="driver-form"><input name="name" placeholder="اسم السائق" required><input name="phone" placeholder="رقم الهاتف" required><input name="car_number" placeholder="رقم السيارة" required><input name="car_type" placeholder="نوع السيارة" required><select name="is_available"><option value="true">متاح</option><option value="false">غير متاح</option></select><button class="primary">إضافة سائق</button></form><div class="table-wrap"><table class="data-table" style="min-width:720px"><thead><tr><th>السائق</th><th>الهاتف</th><th>رقم السيارة</th><th>نوع السيارة</th><th>التوفر</th><th>إجراء</th></tr></thead><tbody id="driversBody"></tbody></table></div></section>
</main>
<script src="config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="admin.js"></script></body></html>
